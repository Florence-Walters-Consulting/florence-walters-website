# Florence Walters Consulting: nginx site. Installed by setup-server.sh.
# HTTPS is added afterwards by enable-https.sh (certbot edits this file).

# www -> main address
server {
    listen 80;
    listen [::]:80;
    server_name www.florencewaltersconsulting.com;
    return 301 $scheme://florencewaltersconsulting.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name florencewaltersconsulting.com;

    # Image uploads (admin form allows 5 MB images; leave room for the form around them).
    client_max_body_size 10m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uploaded images are served straight from disk (outside the code folder, so deployments
    # never touch them). File names are random, so they can be cached for a long time.
    location /site_img/ {
        alias /var/lib/fwc/site_img/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        # OVERWRITE (never append to) the client address headers: the site uses them for
        # rate limiting, and a visitor must not be able to fake them.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
